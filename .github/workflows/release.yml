name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish tagged CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Verify source and tag version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$(go run ./cmd/mdc version | sed -E 's/^MDC CLI version ([^ ]+).*/\1/')" = "$version"
      - name: Run release tests
        run: go test -count=1 ./...
      - name: Build portable CLI artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in \
            linux/amd64 linux/arm64 \
            windows/amd64 windows/arm64 \
            darwin/amd64 darwin/arm64
          do
            goos="${target%/*}"
            goarch="${target#*/}"
            suffix=""
            if [ "$goos" = windows ]; then suffix=".exe"; fi
            output="dist/mdc_${version}_${goos}_${goarch}${suffix}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "$output" ./cmd/mdc
          done
          (cd dist && sha256sum mdc_* > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          --verify-tag
          --title "MDC ${GITHUB_REF_NAME}"
          --notes-file COMMUNITY_LAUNCH.md
